name: EFP - generar fotos

on:
  workflow_dispatch:
  push:
    branches: [claude/awesome-einstein-mko6dg]
    paths:
      - "efp/tools/**"
      - ".github/workflows/efp-images.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnóstico xAI (no expone la clave)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY_2 }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then echo "Sin XAI_API_KEY_2"; exit 0; fi
          echo "Longitud de la clave: ${#XAI_API_KEY} caracteres"
          echo "-- GET /v1/api-key --"
          curl -sS -o /tmp/key.json -w "HTTP %{http_code}\n" https://api.x.ai/v1/api-key -H "Authorization: Bearer $XAI_API_KEY"
          cat /tmp/key.json; echo
          echo "-- GET /v1/models --"
          curl -sS -o /tmp/models.json -w "HTTP %{http_code}\n" https://api.x.ai/v1/models -H "Authorization: Bearer $XAI_API_KEY"
          cat /tmp/models.json; echo

      - name: Generar fotos por API
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY$GEMINI_API_KEY$OPENAI_API_KEY" ]; then
            echo "::warning::No hay ninguna clave cargada en Settings > Secrets > Actions (XAI_API_KEY, GEMINI_API_KEY u OPENAI_API_KEY)."
            exit 0
          fi
          node efp/tools/generate-images.mjs

      - name: Subir fotos al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add efp/img/*.jpg 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin fotos nuevas."; exit 0; fi
          git commit -m "Add generated EFP product photos"
          git push
